<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Chat Modern</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SCREEN LOGIN -->
    <div id="login-screen" class="screen">
        <div class="login-card">
            <h2>Selamat Datang</h2>
            <p>Masukkan ID Pengguna dan Password Anda</p>
            <form id="login-form">
                <div class="input-group">
                    <input type="text" id="input-user-id" placeholder="ID Pengguna (Contoh: budi123)" required autocomplete="off">
                </div>
                <div class="input-group">
                    <input type="password" id="input-password" placeholder="Password" required>
                </div>
                <div class="input-group">
                    <input type="text" id="input-name" placeholder="Nama Lengkap / Panggilan (Jika baru)" autocomplete="off">
                </div>
                <button type="submit" id="btn-login" class="primary-btn">Masuk / Daftar</button>
            </form>
        </div>
    </div>

    <!-- SCREEN CHAT -->
    <div id="chat-screen" class="screen" style="display: none;">
        <div class="chat-container">
            <!-- Sidebar Online Users -->
            <div class="sidebar">
                <h3>Pengguna Online (<span id="online-count">0</span>)</h3>
                <div id="online-users-list" class="online-users-list"></div>
            </div>

            <!-- Main Chat Area -->
            <div class="chat-main">
                <div class="chat-header">
                    <div>
                        <h3 id="header-user-name">Nama</h3>
                        <small id="header-user-id">ID: -</small>
                    </div>
                    <div id="typing-indicator" class="typing-indicator" style="display: none;"></div>
                </div>

                <div id="messages" class="messages-container"></div>

                <!-- Preview Reply / Swipe to Reply -->
                <div id="reply-preview" class="reply-preview" style="display: none;">
                    <div class="reply-preview-content">
                        <strong id="reply-name"></strong>
                        <p id="reply-text"></p>
                    </div>
                    <button id="cancel-reply" class="tool-btn">&times;</button>
                </div>

                <!-- Recording VN Box -->
                <div id="recording-box" class="recording-box" style="display: none;">
                    <span class="rec-dot"></span>
                    <span id="rec-timer">00:00</span>
                    <button id="cancel-rec-btn" class="icon-btn-danger">Batal</button>
                    <button id="stop-send-rec-btn" class="icon-btn-success">Kirim VN</button>
                </div>

                <!-- Input Chat -->
                <div class="chat-input-area">
                    <button id="image-btn" class="tool-btn" title="Kirim Gambar">📷</button>
                    <input type="file" id="image-input" accept="image/*" style="display: none;">

                    <button id="video-btn" class="tool-btn" title="Kirim Video">🎥</button>
                    <input type="file" id="video-input" accept="video/*" style="display: none;">

                    <button id="vn-btn" class="tool-btn" title="Voice Note">🎙️</button>

                    <input type="text" id="message-input" placeholder="Ketik pesan..." autocomplete="off">
                    <button id="send-btn" class="primary-btn">Kirim</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DELETE -->
    <div id="delete-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <p>Hapus pesan ini?</p>
            <button id="btn-delete-forme" class="secondary-btn">Hapus untuk Saya</button>
            <button id="btn-delete-foreveryone" class="danger-btn" style="display: none;">Hapus untuk Semua</button>
            <button id="btn-cancel-delete" class="primary-btn">Batal</button>
        </div>
    </div>

    <!-- MODAL MEDIA PREVIEW -->
    <div id="media-preview-modal" class="modal" style="display: none;" onclick="closeMediaPreview()">
        <div class="modal-media-content" onclick="event.stopPropagation()">
            <span class="close-modal" onclick="closeMediaPreview()">&times;</span>
            <img id="preview-image" style="display: none; max-width: 100%; max-height: 80vh;" />
            <video id="preview-video" controls style="display: none; max-width: 100%; max-height: 80vh;"></video>
        </div>
    </div>

    <!-- OVERLAY UPLOAD -->
    <div id="upload-overlay" class="modal" style="display: none;">
        <div class="modal-content">
            <p id="upload-status-text">Mengunggah file...</p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
