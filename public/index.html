<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Obrolan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SCREEN LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Masuk Obrolan</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>ID Pengguna</label>
                    <input type="text" id="input-user-id" placeholder="Masukkan ID Pengguna" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="input-password" placeholder="Masukkan Password" required>
                </div>
                <div class="form-group" id="name-group">
                    <label>Nama Lengkap / Panggilan</label>
                    <input type="text" id="input-name" placeholder="Masukkan Nama Anda">
                </div>
                <button type="submit" id="btn-login">Masuk / Daftar</button>
            </form>
        </div>
    </div>

    <!-- SCREEN CHAT -->
    <div id="chat-screen" style="display: none;">
        <header>
            <div class="header-info">
                <h3>Ruang Obrolan</h3>
                <small>Online: <span id="online-count">0</span></small>
            </div>
        </header>

        <div id="messages"></div>

        <div id="typing-indicator" style="display: none;"></div>
        <div id="upload-progress" style="display: none;">Mengunggah...</div>

        <!-- PRATINJAU BALAS PESAN -->
        <div id="reply-preview" style="display: none;">
            <div class="reply-info">
                <small>Membalas <strong id="reply-name"></strong></small>
                <p id="reply-text"></p>
            </div>
            <button type="button" id="cancel-reply">&times;</button>
        </div>

        <!-- KOTAK REKAMAN VN -->
        <div id="recording-box" style="display: none;">
            <span id="rec-timer">00:00</span>
            <button type="button" id="cancel-rec-btn">Batal</button>
            <button type="button" id="stop-send-rec-btn">Kirim VN</button>
        </div>

        <!-- FOOTER / INPUT CHAT -->
        <footer>
            <div class="input-controls">
                <button type="button" id="image-btn">📷</button>
                <button type="button" id="video-btn">🎥</button>
                <button type="button" id="vn-btn">🎙️</button>

                <input type="file" id="image-input" accept="image/*" style="display: none;">
                <input type="file" id="video-input" accept="video/*" style="display: none;">

                <input type="text" id="message-input" placeholder="Ketik pesan..." autocomplete="off">
                <button type="button" id="send-btn">Kirim</button>
            </div>
        </footer>
    </div>

    <!-- MODAL HAPUS PESAN -->
    <div id="delete-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h4>Hapus Pesan?</h4>
            <button type="button" id="btn-delete-forme">Hapus untuk Saya</button>
            <button type="button" id="btn-delete-foreveryone">Hapus untuk Semua Orang</button>
            <button type="button" id="btn-cancel-delete">Batal</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
    </html>
